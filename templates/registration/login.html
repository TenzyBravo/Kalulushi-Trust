{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:30rem;margin:2rem auto">
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="actions"><button class="btn" type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
