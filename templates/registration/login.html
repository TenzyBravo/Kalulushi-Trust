{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:26rem;margin:2rem auto">
  <h1>Sign in</h1>
  {% if form.errors %}<p class="errorlist">That sign-in didn't work. Check your details and try again.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Staff number, username or email</label>{{ form.username }}
    <label for="id_password">Password</label>{{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="actions"><button class="btn" type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
