{% extends "base.html" %}
{% block title %}Add a pupil{% endblock %}
{% block content %}
<h1>Add a pupil</h1>
<form method="post" class="card">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="muted">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
  {% endfor %}
  <button class="btn" type="submit">Save pupil</button>
</form>
{% endblock %}
