name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_ms
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: localhost
      POSTGRES_DB: school_ms
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Migrate from empty
        run: python manage.py migrate
      - name: Tests
        run: |
          set -o pipefail
          python manage.py test tests -v 2 2>&1 | tee test.log || { python .github/annotate_failures.py test.log; exit 1; }
