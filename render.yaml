# Render Blueprint: the web app and its PostgreSQL database.
# In the Render dashboard: New > Blueprint > pick this repository.
# Both start on the free plan; change `plan` before real school data goes in
# (free databases expire after 30 days and are not backed up).
databases:
  - name: kalulushi-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: school_ms
    user: school

services:
  - type: web
    name: kalulushi-trust
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bash bin/build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: kalulushi-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SCHOOL_YEAR
        value: "2026"
      # The first System Administrator. Set these in the dashboard when creating the Blueprint;
      # change the password after first sign-in.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_STAFF_NUMBER
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false
